<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Work quota settings</title>
  <style>
    body{max-width:680px;margin:40px auto;padding:0 20px;font:16px system-ui;background:#111;color:#fff}form{display:grid;gap:18px}label{display:grid;gap:8px}select,input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #666;background:#1d1d1d;color:#fff}button{cursor:pointer;width:max-content}.note{color:#bbb;line-height:1.5}#status{min-height:1.5em}
  </style>
</head>
<body>
  <h1>Work quota settings</h1>
  <p class="note">ChatGPT does not expose a trustworthy live quota value to this extension. Estimated mode counts prompts submitted from this browser against a daily limit you choose.</p>
  <form id="settings-form">
    <label>Tracking mode
      <select id="mode">
        <option value="unavailable">Quota unavailable</option>
        <option value="estimated">Local estimate</option>
      </select>
    </label>
    <label>Estimated daily task limit
      <input id="daily-limit" type="number" min="1" step="1" value="50">
    </label>
    <label><span><input id="notifications" type="checkbox" checked> Show threshold notifications</span></label>
    <button type="submit">Save settings</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="options.js"></script>
</body>
</html>
